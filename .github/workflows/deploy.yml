name: Deploy reserve map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build for project path
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
